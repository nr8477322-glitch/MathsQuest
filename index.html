
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MathsQuest</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #58cc02;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .parrot {
      font-size: 80px;
      margin-bottom: 15px;
    }

    .welcome h2 {
      color: #58cc02;
      margin-bottom: 10px;
    }

    .classes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }

    .class-card {
      background: white;
      border: 2px solid #ddd;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .class-card:hover {
      transform: translateY(-3px);
      border-color: #58cc02;
    }

    .class-card h3 {
      color: #333;
      margin-bottom: 8px;
    }

    .class-card button {
      background: #58cc02;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 10px;
      cursor: pointer;
    }

    #message {
      margin-top: 25px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>🦜 MathsQuest</h1>
    <p>Apprends les mathématiques en t'amusant !</p>
  </header>

  <main>

    <section class="welcome">
      <div class="parrot">🦜</div>

      <h2>Bienvenue sur MathsQuest !</h2>

      <p>
        Choisis ta classe et commence ton aventure mathématique.
      </p>

      <div class="classes">

        <div class="class-card">
          <h3>6e</h3>
          <button onclick="choisirClasse('6e')">Commencer</button>
        </div>

        <div class="class-card">
          <h3>5e</h3>
          <button onclick="choisirClasse('5e')">Commencer</button>
        </div>

        <div class="class-card">
          <h3>4e</h3>
          <button onclick="choisirClasse('4e')">Commencer</button>
        </div>

        <div class="class-card">
          <h3>3e</h3>
          <button onclick="choisirClasse('3e')">Commencer</button>
        </div>

        <div class="class-card">
          <h3>2nde</h3>
          <button onclick="choisirClasse('2nde')">Commencer</button>
        </div>

        <div class="class-card">
          <h3>1ère</h3>
          <button onclick="choisirClasse('1ère')">Commencer</button>
        </div>

        <div class="class-card">
          <h3>Terminale</h3>
          <button onclick="choisirClasse('Terminale')">Commencer</button>
        </div>

      </div>

      <div id="message"></div>
    </section>

  </main>

  <script>


function choisirClasse(classe) {
    const message = document.getElementById("message");

    message.textContent = "🎯 Tu as choisi la classe " + classe + " !";

    localStorage.setItem("mathquest_classe", classe);

    setTimeout(function() {
        message.textContent = "🦜 Bienvenue dans MathQuest !";
    }, 2000);
}

</script>
    
  

</body>
</html>
